name: RevenueLens checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Offline current-market and historical fixture invariants
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build browser report
        run: npm run build
      - name: Validate report exports and browser model
        run: npm test
